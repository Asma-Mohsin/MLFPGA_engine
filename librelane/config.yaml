USE_SLANG: true
VERILOG_DEFINES: [LIBRELANE_HARD_MACROS, IHP_SG13CMOS5L]
ERROR_ON_SYNTH_CHECKS: false

CLOCK_PORT: clk_i
CLOCK_NET: clk_i
CLOCK_PERIOD: 10.0

FP_SIZING: absolute
# Reserve a left margin for the fabric; place ACT macros beside it and PSUM macros at the core's right edge.
DIE_AREA: [0, 0, 3600, 4800]
PL_TARGET_DENSITY_PCT: 20

VDD_NETS: [VDD]
GND_NETS: [VSS]
PDN_MULTILAYER: true

PDN_MACRO_CONNECTIONS:
  - "npu_inst\\.act_buffer_stage\\.gen_containers.*\\.container_inst.* VDD VSS VDD VSS"
  - "npu_inst\\.psum_requant_stage\\.gen_containers.*\\.container_inst.* VDD VSS VDD VSS"

