USE_SLANG: true
VERILOG_DEFINES: [LIBRELANE_HARD_MACROS, IHP_SG13CMOS5L]
ERROR_ON_SYNTH_CHECKS: false

CLOCK_PORT: clk_i
CLOCK_NET: clk_i
CLOCK_PERIOD: 10.0

FP_SIZING: absolute
# Shift the macro layout right by 200 um and widen the die to preserve the PSUM column's right-edge position.
DIE_AREA: [0, 0, 3800, 5000]
PL_TARGET_DENSITY_PCT: 50
FP_OBSTRUCTIONS:
  - [3774.24, 15.12, 3794.24, 4784.88]
#  - [300, 15.12, 2647.68, 100]
# - [300, 4629.7, 2647.68, 4784.88]
SLANG_ARGUMENTS: ['--keep-hierarchy']
#SYNTH_HIERARCHY. _MODE: keep
GPL_CELL_PADDING: 4
DPL_CELL_PADDING: 2

VDD_NETS: [VDD]
GND_NETS: [VSS]
PDN_MULTILAYER: true
PDN_CFG: dir::pdn_cfg.tcl
IO_PIN_ORDER_CFG: dir::pin_order.cfg

GRT_ALLOW_CONGESTION: True
#DRT_OPT_ITERS: 3
ERROR_ON_DISCONNECTED_PINS: False
GRT_OVERFLOW_ITERS: 1
DRT_ANTENNA_REPAIR_ITERS: 0
PDN_MACRO_CONNECTIONS:
  - "npu_inst\\.act_buffer_stage\\.gen_containers.*\\.container_inst.* VDD VSS VDD VSS"
  - "npu_inst\\.psum_requant_stage\\.gen_containers.*\\.container_inst.* VDD VSS VDD VSS"

