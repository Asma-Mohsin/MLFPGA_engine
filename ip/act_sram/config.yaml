
meta:
  version: 3
  flow: Classic
  substituting_steps:
    Magic.DRC: null
    OpenROAD.CTS: null

DESIGN_NAME: act_bank_container

VERILOG_FILES:
- dir::./*.sv
- dir::../common/sram_bank.sv
- dir::../common/RM_IHPSG13_1P_256x32_c2_bm_bist.v

#VERILOG_DEFINES: [FUNCTIONAL]

USE_SLANG: True
#SLANG_ARGUMENTS: ['--keep-hierarchy']
# NOTE: Seems to only report false positives, flow runs also with the unmapped
# cells
ERROR_ON_SYNTH_CHECKS: False

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

PNR_SDC_FILE: dir::constraint.sdc
SIGNOFF_SDC_FILE: dir::constraint.sdc
FALLBACK_SDC: dir::constraint.sdc
IO_PIN_ORDER_CFG: dir::pin_order.cfg
PDN_EXTEND_TO: core_ring
PDN_CFG: dir::pdn_cfg.tcl
# Timing
CLOCK_PORT: clk_i
CLOCK_NET: clk_i
CLOCK_PERIOD: 10.0
DRT_OPT_ITERS: 40
# NOTE: Use these if the setup timing is violated in the typical corner
PL_RESIZER_SETUP_SLACK_MARGIN: 2.5
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 80

ERROR_ON_DISCONNECTED_PINS: False
# Floorplanning

FP_SIZING: absolute
SYNTH_STRATEGY: "AREA 2"

DIE_AREA: [0, 0, 267, 150]
PL_TARGET_DENSITY_PCT: 20
GRT_ALLOW_CONGESTION: true

# Allow free displacement (set to number that is definitely bigger than the die
# size for each dimension)
#PL_MAX_DISPLACEMENT_X: 2000
PL_MAX_DISPLACEMENT_Y: 2000

IO_PIN_V_LAYER: Metal3
IO_PIN_H_LAYER: Metal2
PDN_CORE_RING: True
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_RING_HSPACING: 1
PDN_CORE_RING_VSPACING: 1
PDN_CORE_RING_VWIDTH: 1
PDN_CORE_RING_HWIDTH: 1
PDN_CORE_RING_VOFFSET: 4
PDN_CORE_RING_HOFFSET: 3
PDN_VOFFSET: 4
PDN_HOFFSET: 4
PDN_VPITCH: 30
PDN_HPITCH: 30
# PDN Setup
BOTTOM_MARGIN_MULT: 2
TOP_MARGIN_MULT: 3
RIGHT_MARGIN_MULT: 17
LEFT_MARGIN_MULT: 16

RT_MAX_LAYER: Metal4

VDD_NETS:
- VDD
GND_NETS:
- VSS
PDN_MULTILAYER: True
FP_MACRO_HORIZONTAL_HALO: 1
FP_MACRO_VERTICAL_HALO: 3
PDN_VERTICAL_HALO: 2
PDN_HORIZONTAL_HALO: 2
PDN_CORE_RING_ALLOW_OUT_OF_DIE: False
PDN_MACRO_CONNECTIONS:
  - "act_sram_inst.gen_ihp_512x8.u_sram_512x8 VDD VSS VDD! VSS!"
  - "act_sram_inst.gen_ihp_512x8.u_sram_512x8 VDD VSS VDDARRAY! VSS!"
  

MACROS:
  RM_IHPSG13_1P_512x8_c3_bm_bist:
    gds:
      - dir::../../../PDK/ihp-sg13cmos5l/libs.ref/sg13cmos5l_sram/gds/RM_IHPSG13_1P_512x8_c3_bm_bist.gds
    lef:
      - dir::../../../PDK/ihp-sg13cmos5l/libs.ref/sg13cmos5l_sram/lef/RM_IHPSG13_1P_512x8_c3_bm_bist.lef
    nl:
      - dir::../../../PDK/ihp-sg13cmos5l/libs.ref/sg13cmos5l_sram/verilog/RM_IHPSG13_1P_512x8_c3_bm_bist.v
    lib:
      "*_typ_1p20V_25C":
        - dir::../../../PDK/ihp-sg13cmos5l/libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_512x8_c3_bm_bist_typ_1p20V_25C.lib
      "nom_fast_1p32V_m40C":
        - dir::../../../PDK/ihp-sg13cmos5l/libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_512x8_c3_bm_bist_fast_1p32V_m55C.lib
      "nom_slow_1p08V_125C":
        - dir::../../../PDK/ihp-sg13cmos5l/libs.ref/sg13cmos5l_sram/lib/RM_IHPSG13_1P_512x8_c3_bm_bist_slow_1p08V_125C.lib
    instances:
      act_sram_inst.gen_ihp_512x8.u_sram_512x8:
        location: [17.5, 25]
        orientation: N
